[project]
name = "geophysics_agent"
version = "0.1.0"
dependencies = [
    "chromadb>=1.4.0",
    "h5py>=3.15.1",
    "matplotlib>=3.10.8",
    "numpy>=1.24.0",
    "openai>=2.14.0",
    "pandas>=2.0.0",
    "python-dotenv",
    "scipy>=1.10.0",
    "streamlit>=1.45.0",
]

[project.scripts]
# geos-agent = "geos_agent.tools.tools:main"
geos-agent = "geos_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.workspace]
members = []
